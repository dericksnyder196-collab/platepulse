<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Log in | PlatePulse</title>
        <link rel="stylesheet" href="/css/tokens.css" />
        <link rel="stylesheet" href="/css/fonts.css" />
        <link rel="stylesheet" href="/css/base.css" />
        <link rel="stylesheet" href="/css/components.css" />
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body data-page="login">
        <a class="skip-link" href="#main">Skip to main content</a>

        <main class="auth" id="main">
            <div class="auth__panel">
                <p class="wordmark">PlatePulse</p>

                <div class="stack stack--tight">
                    <h1 id="authTitle">Log in</h1>
                    <p class="muted">Manage your menu, orders and payouts in one place.</p>
                </div>

                <form id="authForm" class="panel stack">
                    <div class="field">
                        <label class="field__label" for="email">Email</label>
                        <input
                            class="input"
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                        />
                    </div>

                    <div class="field">
                        <label class="field__label" for="password">Password</label>
                        <input
                            class="input"
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            aria-describedby="passwordHint"
                            required
                        />
                        <p class="field__hint" id="passwordHint" hidden>
                            Use at least 8 characters.
                        </p>
                    </div>

                    <button class="btn btn--block" type="submit" id="submitBtn">Log in</button>
                    <div id="message" class="notice notice--error" role="alert"></div>
                </form>

                <button class="btn btn--quiet btn--block" type="button" id="modeToggle">
                    Create an account
                </button>
            </div>
        </main>

        <script src="/js/api_client.js"></script>
        <script src="/js/ui.js"></script>
        <script src="/js/app.js"></script>
    </body>
</html>
